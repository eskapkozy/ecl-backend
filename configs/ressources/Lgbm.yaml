run:
  name: "lightgbm Train"
  version: 1
  random_state: 42
  is_train: true

# Model
model:
  name: "lightgbm"
  grid_search:
    n_trials: 15
    constraints:
      recall_min: 0.90
      f1_min: 0.15
    param_space:
      max_depth: [ 3, 7 ]
      min_child_samples: [ 10, 100 ]
      num_leaves: [ 20, 100 ]
      reg_lambda: [ 1, 10 ]
      reg_alpha: [ 0, 1 ]
      subsample: [ 0.7, 0.9 ]
      colsample_bytree: [ 0.7, 0.9 ]
      learning_rate: [ 0.01, 0.1 ]
      n_estimators: [ 100, 500 ]

  hyperparameters:

    regularisation:

      # profondeur max
      max_depth: 4

      # équivalent approximatif de min_child_weight
      min_child_samples: 20

      # L2
      reg_lambda: 1.0

      # L1
      reg_alpha: 0.1

      # row sampling
      subsample: 0.8
      # feature sampling
      colsample_bytree: 0.8
      learning_rate: 0.1
      # IMPORTANT dans LightGBM
      num_leaves: 15
    n_estimators: 1000
    early_stopping_rounds: 10
    scale_pos_weight: 1
    eval_metric: "binary_logloss"

  calibration:
    enabled: true
    method: "sigmoid"
    cv: "prefit"





# Component

woe:
  enabled: true
  iv_threshold: 0.02
  metric: "woe"
  persistence: false



smote:
  enabled: true
  sampling_strategy: "auto"
  random_state: 42

correlation:
  enabled: true
  threshold: 0.8

# Evaluation & Metrics

evaluation:
  roc_auc: true
  recall: true
  precision: true
  f1_score: true
  confusion_matrix: true

  threshold:
    fixed_value: 0.22
    enabled: true

    # génération des seuils
    search:
      start: 1
      stop: 100
      step: 1

    # contraintes de sélection
    constraints:

      recall_min: 0.80
      f1_min: 0.15
      precision_min: 0.20


    # stratégie d'optimisation
    objective:

      primary_metric: "f1"
      direction: "maximize"

    # valeurs fallback
    defaults:
      threshold: 0.25


# stack Used

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "classification"

  # Artifact path
  run_artifact_path:

    run_id:  #"802e3adb80994db584fb17d8ec0eeb77"
    binning_process:
      name: #"binning_process"
      path: #"binning_process"
      artifact_type: #"PKL"
      ismodel: false

    model_fit:
      name: #"model_fit"
      path: #"model_fit"
      artifact_type: #"PKL"
      ismodel: false




# Livrable ( Artifacts , Reports , Plot )

artifacts:
  log_model: true
  log_woe: true
  log_reports: true