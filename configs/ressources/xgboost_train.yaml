run:
  name: "Xgboost Train"
  version: 1
  random_state: 42
  is_train: true

# Model
model:
  name: "Xgboost"
  hyperparameters:
    regularisation:
      max_depth: 4
      min_child_weight: 5
      reg_lambda: 1.0
      reg_alpha: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      learning_rate: 0.1
    n_estimators: 1000
    early_stopping_rounds: 10
    eval_metric: "logloss"
    # scale_pos_weight n'est pas fixé ici — calculé dynamiquement
    # dans XGBoostRun à partir du ratio neg/pos de y_train_resampled

# Component

woe:
  enabled: true
  iv_threshold: 0.02
  metric: "woe"
  persistence: false

smote:
  enabled: true
  sampling_strategy: "auto"
  random_state: 42

correlation:
  enabled: true
  threshold: 0.8

# Evaluation & Metrics

evaluation:
  roc_auc: true
  recall: true
  precision: true
  f1_score: true
  confusion_matrix: true

# Stack used

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "classification"

  # Artifact path
  run_artifact_path:
    run_id:
    binning_process:
      name:
      path:
      artifact_type:
      ismodel: false
    model_fit:
      name:
      path:
      artifact_type:
      ismodel: false

# Livrable (Artifacts, Reports, Plot)
artifacts:
  log_model: true
  log_woe: true
  log_reports: true